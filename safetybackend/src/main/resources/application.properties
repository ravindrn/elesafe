# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/elephant_safety?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sqluser123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=elephantSafetySecretKey2024ForJWTTokenGenerationSpringBoot
jwt.expiration=86400000

# Allow circular references
spring.main.allow-circular-references=true

# Thymeleaf Configuration for Admin Panel
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Security Debug (temporarily)
logging.level.org.springframework.security=DEBUG