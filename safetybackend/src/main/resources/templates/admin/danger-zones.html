<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danger Zones - Elephant Safety Sri Lanka</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .navbar {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a27 100%);
            color: white;
            padding: 0 30px;
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.2); }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 6px; text-decoration: none; color: white; }
        .container { margin-top: 85px; padding: 25px 35px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-header h2 { color: #333; }
        .btn-primary { background: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; }
        .btn-sm { padding: 5px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin: 0 2px; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; color: white; }
        .table-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; font-weight: 600; border-bottom: 2px solid #e0e0e0; }
        td { padding: 12px; border-bottom: 1px solid #e0e0e0; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-critical { background: #f8d7da; color: #721c24; }
        .badge-high { background: #fff3cd; color: #856404; }
        .badge-medium { background: #d1ecf1; color: #0c5460; }
        .badge-low { background: #d4edda; color: #155724; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; background: #1a472a; color: white; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; }
        .close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; justify-content: flex-end; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        @media (max-width: 768px) { .nav-links { display: none; } .container { padding: 15px; } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">🐘 Elephant Safety Sri Lanka</div>
    <div class="nav-links">
        <a href="/admin/dashboard">📊 Dashboard</a>
        <a href="/admin/users">👥 Users</a>
        <a href="/admin/danger-zones" class="active">⚠️ Danger Zones</a>
        <a href="/admin/reports">📋 Reports</a>
        <a href="/admin/emergency-contacts">📞 Emergency</a>
        <a href="/admin/news">📰 News</a>
        <a href="/admin/safety-tips">💡 Safety Tips</a>

    </div>
    <div class="user-info">
        <span>👋 <strong th:text="${adminName}">Admin</strong></span>
        <a href="/logout" class="logout-btn">🚪 Logout</a>
    </div>
</nav>
<div class="container">
    <div class="page-header">
        <h2>⚠️ Danger Zones Management</h2>
        <button class="btn-primary" onclick="openAddModal()">➕ Add Danger Zone</button>
    </div>
    <div class="table-container">
        <table id="zonesTable">
            <thead><tr><th>ID</th><th>Zone Name</th><th>Location</th><th>District</th><th>Risk Level</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody><tr><td colspan="7" style="text-align:center;">Loading...</td></tr></tbody>
        </table>
    </div>
</div>

<div id="zoneModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="modalTitle">Add Danger Zone</h3><button class="close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="zoneId">
            <div class="form-group"><label>Zone Name</label><input type="text" id="zoneName"></div>
            <div class="form-group"><label>Latitude</label><input type="text" id="latitude"></div>
            <div class="form-group"><label>Longitude</label><input type="text" id="longitude"></div>
            <div class="form-group"><label>Radius (meters)</label><input type="number" id="radius" value="500"></div>
            <div class="form-group"><label>District</label><input type="text" id="district"></div>
            <div class="form-group"><label>Risk Level</label><select id="riskLevel"><option value="CRITICAL">CRITICAL</option><option value="HIGH">HIGH</option><option value="MEDIUM">MEDIUM</option><option value="LOW">LOW</option></select></div>
        </div>
        <div class="modal-footer"><button onclick="closeModal()" style="padding:10px 20px; background:#6c757d; color:white; border:none; border-radius:8px;">Cancel</button><button onclick="saveZone()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:8px;">Save</button></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function loadZones(){$.get('/api/admin/danger-zones',function(data){let html='';data.forEach(z=>{let c=z.riskLevel==='CRITICAL'?'badge-critical':(z.riskLevel==='HIGH'?'badge-high':(z.riskLevel==='MEDIUM'?'badge-medium':'badge-low'));html+=`<tr><td>${z.id}</td><td>${z.zoneName}</td><td>${z.latitude},${z.longitude}</td><td>${z.district||'-'}</td><td><span class="badge ${c}">${z.riskLevel}</span></td><td><span class="badge badge-low">${z.status}</span></td><td><button class="btn-sm btn-edit" onclick="editZone(${z.id})">Edit</button><button class="btn-sm btn-delete" onclick="deleteZone(${z.id})">Delete</button></td></tr>`;});$('#zonesTable tbody').html(html);});}
    function openAddModal(){$('#modalTitle').text('Add Danger Zone');$('#zoneId').val('');$('#zoneName').val('');$('#latitude').val('');$('#longitude').val('');$('#radius').val('500');$('#district').val('');$('#riskLevel').val('MEDIUM');$('#zoneModal').css('display','flex');}
    function editZone(id){$.get('/api/admin/danger-zones',function(data){let z=data.find(x=>x.id==id);if(z){$('#modalTitle').text('Edit Danger Zone');$('#zoneId').val(z.id);$('#zoneName').val(z.zoneName);$('#latitude').val(z.latitude);$('#longitude').val(z.longitude);$('#radius').val(z.radius);$('#district').val(z.district||'');$('#riskLevel').val(z.riskLevel);$('#zoneModal').css('display','flex');}});}
    function closeModal(){$('#zoneModal').css('display','none');}
    function saveZone(){let data={zoneName:$('#zoneName').val(),latitude:parseFloat($('#latitude').val()),longitude:parseFloat($('#longitude').val()),radius:parseInt($('#radius').val()),district:$('#district').val(),riskLevel:$('#riskLevel').val()};let id=$('#zoneId').val();let url=id?`/api/admin/danger-zones/${id}`:'/api/admin/danger-zones';let method=id?'PUT':'POST';$.ajax({url:url,type:method,contentType:'application/json',data:JSON.stringify(data),success:function(){closeModal();loadZones();alert('Zone saved!');},error:function(){alert('Failed');}});}
    function deleteZone(id){if(confirm('Delete?'))$.ajax({url:`/api/admin/danger-zones/${id}`,type:'DELETE',success:function(){loadZones();}});}
    $(document).ready(loadZones);
</script>
</body>
</html>
