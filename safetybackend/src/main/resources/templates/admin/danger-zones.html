<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danger Zones Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .navbar {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a27 100%);
            color: white;
            padding: 0 30px;
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }
        .nav-links a { color: white; text-decoration: none; padding: 8px 18px; }
        .container { margin-top: 85px; padding: 25px 35px; }
        .add-form {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        input, select { padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px; }
        button { background: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; }
        table { width: 100%; background: white; border-radius: 20px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #1a472a; color: white; }
        .risk-HIGH { color: #f44336; font-weight: bold; }
        .risk-MEDIUM { color: #ff9800; font-weight: bold; }
        .risk-LOW { color: #4caf50; font-weight: bold; }
        .delete-btn { background: #f44336; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">🐘 Elephant Safety</div>
    <div class="nav-links">
        <a href="/web/admin/dashboard">Dashboard</a>
        <a href="/web/admin/danger-zones" class="active">Danger Zones</a>
        <a href="/web/admin/reports">Reports</a>
    </div>
    <div><a href="/web/logout" style="color:white">Logout</a></div>
</nav>
<div class="container">
    <h1>⚠️ Danger Zones Management</h1>

    <div class="add-form">
        <h3>Add New Danger Zone</h3>
        <form id="addZoneForm">
            <div class="form-grid">
                <input type="text" name="locationName" placeholder="Location Name" required>
                <input type="number" step="any" name="latitude" placeholder="Latitude" required>
                <input type="number" step="any" name="longitude" placeholder="Longitude" required>
                <select name="riskLevel">
                    <option value="HIGH">High Risk</option>
                    <option value="MEDIUM">Medium Risk</option>
                    <option value="LOW">Low Risk</option>
                </select>
                <select name="status">
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>
            <button type="submit">Add Zone</button>
        </form>
    </div>

    <table>
        <thead><tr><th>ID</th><th>Location</th><th>Coordinates</th><th>Risk</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
        <tr th:each="zone : ${dangerZones}">
            <td th:text="${zone.id}">-</td>
            <td th:text="${zone.locationName}">-</td>
            <td th:text="${zone.latitude} + ', ' + ${zone.longitude}">-</td>
            <td><span th:class="'risk-' + ${zone.riskLevel}" th:text="${zone.riskLevel}">-</span></td>
            <td th:text="${zone.status}">-</td>
            <td><button class="delete-btn" th:onclick="'deleteZone(' + ${zone.id} + ')'">Delete</button></td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    document.getElementById('addZoneForm').onsubmit = async function(e) {
        e.preventDefault();
        var form = e.target;
        var data = {
            locationName: form.locationName.value,
            latitude: parseFloat(form.latitude.value),
            longitude: parseFloat(form.longitude.value),
            riskLevel: form.riskLevel.value,
            status: form.status.value
        };
        var response = await fetch('/api/admin/danger-zones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (response.ok) { window.location.reload(); }
        else { alert('Failed to add'); }
    };
    async function deleteZone(id) {
        if (confirm('Delete this zone?')) {
            var response = await fetch('/api/admin/danger-zones/' + id, { method: 'DELETE' });
            if (response.ok) { window.location.reload(); }
            else { alert('Failed to delete'); }
        }
    }
</script>
</body>
</html>
