<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .navbar {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a27 100%);
            color: white;
            padding: 0 30px;
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.2); }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 6px; text-decoration: none; color: white; }
        .container { margin-top: 85px; padding: 25px 35px; }
        h1 { color: #1a472a; margin-bottom: 20px; }
        .stats-summary { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-badge { background: white; padding: 15px 25px; border-radius: 15px; flex: 1; text-align: center; min-width: 120px; }
        .stat-badge .number { font-size: 32px; font-weight: bold; color: #1a472a; }
        table { width: 100%; background: white; border-radius: 20px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #1a472a; color: white; }
        .status-PENDING { color: #ff9800; font-weight: bold; }
        .status-RESOLVED { color: #4caf50; font-weight: bold; }
        .view-btn, .resolve-btn { padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer; margin: 2px; }
        .view-btn { background: #2196f3; color: white; }
        .resolve-btn { background: #4caf50; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 500px; max-width: 90%; }
        .close { float: right; cursor: pointer; font-size: 24px; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">🐘 Elephant Safety Sri Lanka</div>
    <div class="nav-links">
        <a href="/admin/dashboard">📊 Dashboard</a>
        <a href="/admin/users">👥 User Management</a>
        <a href="/admin/danger-zones">⚠️ Danger Zones</a>
        <a href="/admin/reports" class="active">📋 Reports</a>
        <a href="/admin/contact-us">📞 Contact Us</a>
    </div>
    <div class="user-info">
        <span>👋 <strong id="adminName">Admin</strong></span>
        <a href="/logout" class="logout-btn">🚪 Logout</a>
    </div>
</nav>
<div class="container">
    <h1>📋 Elephant Sighting Reports</h1>
    <div class="stats-summary" id="statsSummary">
        <div class="stat-badge"><h4>⚠️ PENDING</h4><div class="number" id="pendingCount">-</div></div>
        <div class="stat-badge"><h4>✅ RESOLVED</h4><div class="number" id="resolvedCount">-</div></div>
        <div class="stat-badge"><h4>📋 TOTAL</h4><div class="number" id="totalCount">-</div></div>
    </div>
    <div id="reportsTable" class="loading">Loading reports...</div>
</div>

<div id="reportModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // Load all reports
    async function loadReports() {
        try {
            const response = await fetch('/api/admin/reports');
            if (!response.ok) throw new Error('Failed to load');
            const data = await response.json();

            // Update stats
            document.getElementById('pendingCount').innerText = data.pendingCount || 0;
            document.getElementById('resolvedCount').innerText = data.resolvedCount || 0;
            document.getElementById('totalCount').innerText = (data.reports || []).length;

            const reports = data.reports || [];

            if (reports.length === 0) {
                document.getElementById('reportsTable').innerHTML = '<div class="loading">No reports found.</div>';
                return;
            }

            let tableHtml = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Coordinates</th><th>Elephants</th><th>User</th><th>Date</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
            `;

            reports.forEach(report => {
                const date = new Date(report.createdAt).toLocaleString();
                tableHtml += `
                    <tr>
                        <td>${report.id}</td>
                        <td>${report.latitude}, ${report.longitude}</td>
                        <td>${report.elephantCount || 1}</td>
                        <td>${report.userName || 'Anonymous'}</td>
                        <td>${date}</td>
                        <td><span class="status-${report.status}">${report.status}</span></td>
                        <td>
                            <button class="view-btn" onclick="viewReport(${report.id})">👁️ View</button>
                            ${report.status === 'PENDING' ? `<button class="resolve-btn" onclick="resolveReport(${report.id})">✅ Resolve</button>` : ''}
                        </td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;
            document.getElementById('reportsTable').innerHTML = tableHtml;

        } catch (error) {
            document.getElementById('reportsTable').innerHTML = '<div class="loading">Error loading reports</div>';
        }
    }

    // View report details
    async function viewReport(id) {
        try {
            const response = await fetch('/api/admin/reports/' + id);
            if (!response.ok) throw new Error('Failed');
            const report = await response.json();

            document.getElementById('modalBody').innerHTML = `
                <h3>Report Details</h3>
                <p><strong>🗺️ Coordinates:</strong> ${report.latitude}, ${report.longitude}</p>
                <p><strong>🐘 Elephants:</strong> ${report.elephantCount || 1}</p>
                <p><strong>👤 Reported By:</strong> ${report.userName || 'Anonymous'}</p>
                <p><strong>📅 Date:</strong> ${new Date(report.createdAt).toLocaleString()}</p>
                <p><strong>📊 Status:</strong> ${report.status}</p>
            `;
            document.getElementById('reportModal').style.display = 'flex';
        } catch (error) {
            alert('Failed to load report details');
        }
    }

    // Resolve report
    async function resolveReport(id) {
        if (confirm('Mark this report as resolved?')) {
            try {
                const response = await fetch('/api/admin/reports/' + id + '/status', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'RESOLVED' })
                });
                if (response.ok) {
                    loadReports(); // Refresh the table
                } else {
                    alert('Failed to update');
                }
            } catch (error) {
                alert('Network error');
            }
        }
    }

    function closeModal() {
        document.getElementById('reportModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var modal = document.getElementById('reportModal');
        if (event.target === modal) modal.style.display = 'none';
    }

    // Load admin name and reports
    fetch('/api/admin/stats')
        .then(response => response.json())
        .then(data => {
            document.getElementById('adminName').innerText = data.adminName || 'Admin';
        })
        .catch(() => {});

    loadReports();
</script>
</body>
</html>
