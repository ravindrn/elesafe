<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Management - Elephant Safety Sri Lanka</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .navbar {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a27 100%);
            color: white;
            padding: 0 30px;
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.2); }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 6px; text-decoration: none; color: white; transition: 0.3s; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .container { margin-top: 85px; padding: 25px 35px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-header h2 { color: #333; }
        .btn-primary { background: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-primary:hover { background: #1b5e20; transform: translateY(-2px); }
        .btn-sm { padding: 5px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin: 0 2px; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; color: white; }
        .table-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; font-weight: 600; border-bottom: 2px solid #e0e0e0; }
        td { padding: 12px; border-bottom: 1px solid #e0e0e0; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-conservation { background: #d4edda; color: #155724; }
        .badge-alert { background: #fff3cd; color: #856404; }
        .badge-accident { background: #f8d7da; color: #721c24; }
        .badge-sighting { background: #d1ecf1; color: #0c5460; }
        .badge-general { background: #e2e3e5; color: #383d41; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; border-radius: 20px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; background: #1a472a; color: white; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; }
        .close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; justify-content: flex-end; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #2e7d32; }
        @media (max-width: 768px) { .nav-links { display: none; } .container { padding: 15px; } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">🐘 Elephant Safety Sri Lanka</div>
    <div class="nav-links">
        <a href="/admin/dashboard">📊 Dashboard</a>
        <a href="/admin/users">👥 Users</a>
        <a href="/admin/danger-zones">⚠️ Danger Zones</a>
        <a href="/admin/reports">📋 Reports</a>
        <a href="/admin/emergency-contacts">📞 Emergency</a>
        <a href="/admin/news" class="active">📰 News</a>
        <a href="/admin/safety-tips">💡 Safety Tips</a>

    </div>
    <div class="user-info">
        <span>👋 <strong th:text="${adminName}">Admin</strong></span>
        <a href="/logout" class="logout-btn">🚪 Logout</a>
    </div>
</nav>
<div class="container">
    <div class="page-header">
        <h2>📰 News & Updates Management</h2>
        <button class="btn-primary" onclick="openAddModal()">➕ Add News</button>
    </div>
    <div class="table-container">
        <table id="newsTable">
            <thead>
            <tr><th>ID</th><th>Title</th><th>Type</th><th>Source</th><th>Date</th><th>Status</th><th>Actions</th>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="newsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add News</h3>
            <button class="close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="newsId">
            <div class="form-group"><label>Title *</label><input type="text" id="newsTitle" required></div>
            <div class="form-group"><label>Content *</label><textarea id="newsContent" rows="4" required></textarea></div>
            <div class="form-group"><label>Source</label><input type="text" id="newsSource" placeholder="e.g., Daily News, Wildlife Dept"></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="newsImageUrl" placeholder="https://..."></div>
            <div class="form-group"><label>Type *</label>
                <select id="newsType">
                    <option value="CONSERVATION">🌿 Conservation</option>
                    <option value="ALERT">⚠️ Alert</option>
                    <option value="SIGHTING">👁️ Sighting</option>
                    <option value="ACCIDENT">🚨 Accident</option>
                    <option value="GENERAL">📢 General</option>
                </select>
            </div>
            <div class="form-group"><label>Status</label>
                <select id="newsActive">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="closeModal()" style="padding:10px 20px; background:#6c757d; color:white; border:none; border-radius:8px;">Cancel</button>
            <button onclick="saveNews()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:8px;">Save</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function loadNews() {
        $.get('/admin/news/api/list', function(data) {
            let html = '';
            data.forEach(n => {
                let typeClass = n.type === 'CONSERVATION' ? 'badge-conservation' : (n.type === 'ALERT' ? 'badge-alert' : (n.type === 'ACCIDENT' ? 'badge-accident' : (n.type === 'SIGHTING' ? 'badge-sighting' : 'badge-general')));
                let typeIcon = n.type === 'CONSERVATION' ? '🌿' : (n.type === 'ALERT' ? '⚠️' : (n.type === 'ACCIDENT' ? '🚨' : (n.type === 'SIGHTING' ? '👁️' : '📢')));
                let statusBadge = n.isActive ? '<span class="badge badge-conservation">Active</span>' : '<span class="badge badge-general">Inactive</span>';
                let date = n.publishedDate ? n.publishedDate.substring(0,10) : '-';
                html += `<tr>
                    <td>${n.id}</td>
                    <td><strong>${n.title}</strong><br><small style="color:#666">${n.content ? n.content.substring(0,60) + (n.content.length > 60 ? '...' : '') : ''}</small></td>
                    <td><span class="badge ${typeClass}">${typeIcon} ${n.type}</span></td>
                    <td>${n.source || '-'}</td>
                    <td>${date}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn-sm btn-edit" onclick="editNews(${n.id})">Edit</button>
                        <button class="btn-sm btn-delete" onclick="deleteNews(${n.id})">Delete</button>
                    </td>
                </tr>`;
            });
            $('#newsTable tbody').html(html);
        }).fail(() => alert('Failed to load news'));
    }

    function openAddModal() {
        $('#modalTitle').text('Add News');
        $('#newsId').val('');
        $('#newsTitle').val('');
        $('#newsContent').val('');
        $('#newsSource').val('');
        $('#newsImageUrl').val('');
        $('#newsType').val('CONSERVATION');
        $('#newsActive').val('true');
        $('#newsModal').css('display', 'flex');
    }

    function editNews(id) {
        $.get('/admin/news/api/list', function(data) {
            let n = data.find(x => x.id == id);
            if(n) {
                $('#modalTitle').text('Edit News');
                $('#newsId').val(n.id);
                $('#newsTitle').val(n.title);
                $('#newsContent').val(n.content);
                $('#newsSource').val(n.source || '');
                $('#newsImageUrl').val(n.imageUrl || '');
                $('#newsType').val(n.type);
                $('#newsActive').val(n.isActive ? 'true' : 'false');
                $('#newsModal').css('display', 'flex');
            }
        });
    }

    function closeModal() { $('#newsModal').css('display', 'none'); }

    function saveNews() {
        let data = {
            id: $('#newsId').val() || null,
            title: $('#newsTitle').val(),
            content: $('#newsContent').val(),
            source: $('#newsSource').val(),
            imageUrl: $('#newsImageUrl').val(),
            type: $('#newsType').val(),
            isActive: $('#newsActive').val() === 'true'
        };
        if (!data.title || !data.content) { alert('Please fill Title and Content'); return; }
        let url = data.id ? `/admin/news/api/update/${data.id}` : '/admin/news/api/add';
        let method = data.id ? 'PUT' : 'POST';
        $.ajax({ url: url, type: method, contentType: 'application/json', data: JSON.stringify(data), success: function() { closeModal(); loadNews(); alert('News saved!'); }, error: function(xhr) { alert('Error: ' + (xhr.responseJSON?.error || 'Failed to save')); } });
    }

    function deleteNews(id) { if(confirm('Delete this news?')) $.ajax({ url: `/admin/news/api/delete/${id}`, type: 'DELETE', success: function() { loadNews(); alert('Deleted!'); } }); }
    $(document).ready(function() { loadNews(); });
</script>
</body>
</html>
